name: Release Assets
on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  upload-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Create zip
        run: |
          zip -r "${{ github.event.release.name }} Japanese Potion.zip \
            assets/ \
            pack.mcmeta

      - name: Upload to Release
        uses: softprops/actions-gh-release@v2
        with:
          files: release-${{ github.event.release.name }} Japanese Potion.zip \
